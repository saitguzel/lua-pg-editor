lua_package_path "/app/src/?.lua;/app/src/?/init.lua;/app/lib/pg_shared/?.lua;/app/lib/pg_shared/?/init.lua;/app/lib/?.lua;;";
lua_code_cache on;
lua_socket_log_errors off;

init_by_lua_block {
  local config = require("config")
  config.current = config.load()
  require("db.pool").configure(config.current.db)
  -- Lapis json yanıtları "cjson" modülünü kullanır; boş liste [] olarak kodlansın
  require("cjson").encode_empty_table_as_object(false)
  require("cjson.safe").encode_empty_table_as_object(false)
  require("app")
}

init_worker_by_lua_block {
  require("db.pool").warm(5)
  local function start_job(name)
    local ok, mod = pcall(require, name)
    if not ok then
      ngx.log(ngx.ERR, name .. " yuklenemedi: ", tostring(mod))
      return
    end
    local ok2, started, err = pcall(mod.start)
    if not ok2 or not started then
      ngx.log(ngx.ERR, name .. " start hatasi: ", tostring(ok2 and err or started))
    end
  end
  start_job("jobs.log_cleanup")
  start_job("jobs.query_history_cleanup")
  start_job("jobs.password_reset_cleanup")
}

server {
  listen 8080;

  # CORS header'ları tüm yanıtlara (404/405/413 dahil); preflight middleware/cors.handle'da
  header_filter_by_lua_block {
    require("middleware.cors").header_filter()
  }

  location = /api/v1/swagger {
    default_type text/html;
    content_by_lua_block {
      require("handlers.swagger").ui()
    }
    log_by_lua_block {
      require("middleware.logger").log_phase()
    }
  }

  location = /api/v1/swagger.json {
    default_type application/json;
    content_by_lua_block {
      require("handlers.swagger").spec_json()
    }
    log_by_lua_block {
      require("middleware.logger").log_phase()
    }
  }

  location /api/ {
    default_type application/json;
    # F30: execute/csv icin IP bazli rate limit (RATE_LIMIT_RPS r/s, burst 20, nodelay; 0 = kapali).
    # limit_req yerine resty.limit.req: oran env'den okunur, nginx conf sablonu gerekmez.
    access_by_lua_block {
      local uri = ngx.var.uri
      if uri ~= "/api/v1/query/execute" and uri ~= "/api/v1/query/csv" then return end
      local cfg = require("config").get()
      local rps = cfg and cfg.rate_limit_rps or 0
      if rps <= 0 then return end
      local lim, lerr = require("resty.limit.req").new("rate_limit", rps, 20)
      if not lim then ngx.log(ngx.ERR, "rate limit kurulamadi: ", tostring(lerr)) return end
      -- guvenilir proxy arkasinda gercek istemci IP'si (audit_context.client_ip ile ayni kural)
      local ip = ngx.var.remote_addr
      local trusted = cfg and cfg.trusted_proxies_set or {}
      local xff = ngx.var.http_x_forwarded_for
      if trusted[ip] and xff and xff ~= "" then
        for hop in xff:gmatch("[^,]+") do
          hop = hop:match("^%s*(.-)%s*$")
          if not trusted[hop] then ip = hop end
        end
      end
      local delay, err = lim:incoming("exec:" .. ip, true)
      if not delay and err == "rejected" then
        ngx.status = 429
        ngx.header["Retry-After"] = "1"
        ngx.header["Content-Type"] = "application/json"
        ngx.say(require("cjson.safe").encode(require("pg_shared.protocol").error_body(
          { code = "RATE_LIMITED", message = "Cok fazla istek, lutfen bekleyin" }, ngx.ctx.req_id or "-")))
        return ngx.exit(429)
      end
      -- delay > 0: burst icinde, nodelay → bekletmeden gecir
    }
    content_by_lua_block {
      require("lapis").serve("app")
    }
    log_by_lua_block {
      require("middleware.logger").log_phase()
    }
  }

  location / {
    return 404;
  }

  error_page 413 = @json413;
  location @json413 {
    default_type application/json;
    content_by_lua_block {
      local errors = require("middleware.error_handler")
      ngx.status = 413
      local body = require("cjson.safe").encode(
        require("pg_shared.protocol").error_body(
          { code = "PAYLOAD_TOO_LARGE", message = "Istek govdesi cok buyuk" },
          ngx.ctx.req_id or "-"
        )
      )
      ngx.say(body)
    }
  }
}
